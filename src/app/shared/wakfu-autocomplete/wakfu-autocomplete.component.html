<div class="wakfu-autocomplete">
  <input
    #inputEl
    type="text"
    [placeholder]="placeholder()"
    [value]="query()"
    (input)="onInput($any($event.target).value)"
    (focus)="onFocus()"
    (keydown.arrowdown)="moveActive(1); $event.preventDefault()"
    (keydown.arrowup)="moveActive(-1); $event.preventDefault()"
    (keydown.enter)="selectActive(); $event.preventDefault()"
    (keydown.escape)="close()"
  />
  @if (open() && results().length > 0) {
    <div class="wakfu-autocomplete-list">
      @for (r of results(); track r.kind + ':' + (r.id ?? r.name); let i = $index) {
        <div
          class="wakfu-autocomplete-item"
          [class.active]="i === activeIndex() && !r.disabled"
          [class.disabled]="r.disabled"
        >
          <button
            #itemButton
            type="button"
            class="wakfu-autocomplete-item-main"
            [disabled]="r.disabled"
            (click)="select(r)"
          >
            @if (r.rarity) {
              <img class="wakfu-autocomplete-item-rarity" [src]="rarityIconUrl(r.rarity)" alt="" />
            }
            <span class="wakfu-autocomplete-item-icon">
              @if (r.kind === 'item') {
                <app-item-icon [name]="r.name" [id]="r.id" [size]="24" />
              } @else {
                <app-entity-icon [name]="r.name" [id]="r.id" side="enemy" [size]="24" />
              }
            </span>
            <span
              class="wakfu-autocomplete-item-name tooltip-align-left"
              [class.tooltip-below]="i === 0"
              [attr.data-tooltip]="r.label"
              >{{ r.label }}</span
            >
          </button>
          @if (showRecipeButton() && r.kind === 'item' && r.hasRecipe) {
            <button
              type="button"
              class="wakfu-autocomplete-recipe-btn tooltip-align-right"
              [class.tooltip-below]="i === 0"
              [attr.data-tooltip]="'tracker.recipeTooltip' | t"
              [disabled]="recipeLoading()"
              (click)="openRecipe($event, r)"
            >
              <img [src]="recipeIcon" alt="" />
            </button>
          }
        </div>
      }
    </div>
  }
</div>
