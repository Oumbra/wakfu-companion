@if (helpModal.openSection(); as section) {
  <div class="help-modal-backdrop" (click)="helpModal.close()"></div>
  <div class="help-modal">
    <div class="help-modal-header">
      <span class="help-modal-title">{{ 'help.' + section + '.title' | t }}</span>
      <button
        class="icon-btn help-modal-close"
        type="button"
        [attr.data-tooltip]="'profile.closeToast' | t"
        (click)="helpModal.close()"
      >
        ×
      </button>
    </div>
    <div class="help-modal-body">{{ 'help.' + section + '.body' | t }}</div>
  </div>
}
