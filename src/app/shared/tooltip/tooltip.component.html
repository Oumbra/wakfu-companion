@if (request(); as req) {
  <div
    class="app-tooltip"
    [id]="req.id"
    role="tooltip"
    [class.app-tooltip-multiline]="req.multiline"
    [class.app-tooltip-rows]="!!req.rows"
    [style.left.px]="style()!.left"
    [style.top.px]="style()!.top"
    [style.transform]="style()!.transform"
  >
    @if (req.rows; as rows) {
      @for (row of rows; track row[0]) {
        <span class="app-tooltip-row-label">{{ row[0] }}</span>
        <span class="app-tooltip-row-value">{{ row[1] }}</span>
      }
    } @else {
      {{ req.text }}
    }
  </div>
}
