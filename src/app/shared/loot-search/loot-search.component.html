<svg
  class="loot-search-icon"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round"
>
  <circle cx="11" cy="11" r="7" />
  <path d="M21 21l-4.3-4.3" />
</svg>
<input
  type="text"
  class="loot-search-input"
  [placeholder]="placeholder()"
  [value]="value()"
  (input)="onInput($event)"
/>
@if (value()) {
  <button
    type="button"
    class="loot-search-clear icon-btn"
    [appTooltip]="clearTooltip()"
    (click)="clear()"
  >
    ×
  </button>
}
