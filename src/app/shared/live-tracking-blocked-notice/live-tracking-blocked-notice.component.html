@if (show()) {
  <app-announcement-card
    tone="important"
    [badge]="'liveTrackingBlocked.badge' | t"
    [cardTitle]="'liveTrackingBlocked.title' | t"
    [dismissLabel]="'update.dismiss' | t"
    [actionLabel]="'liveTrackingBlocked.action' | t"
    (dismiss)="dismiss()"
    (action)="openOverlay()"
  >
    <p class="live-tracking-blocked-text" [innerHTML]="'liveTrackingBlocked.text' | tHtml"></p>
    <p class="live-tracking-blocked-text" [innerHTML]="'liveTrackingBlocked.solution' | tHtml"></p>
  </app-announcement-card>
}
