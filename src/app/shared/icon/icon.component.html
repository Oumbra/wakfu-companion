@switch (name()) {
  @case ('clock') {
    <svg [style.width.px]="size()" [style.height.px]="size()" viewBox="0 0 24 24" fill="none" stroke="currentColor" [attr.stroke-width]="strokeWidth()" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="9" />
      <path d="M12 7v5l3 3" />
    </svg>
  }
  @case ('clock-long') {
    <svg [style.width.px]="size()" [style.height.px]="size()" viewBox="0 0 24 24" fill="none" stroke="currentColor" [attr.stroke-width]="strokeWidth()" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="9" />
      <path d="M12 7v5l3.5 3.5" />
    </svg>
  }
  @case ('reset') {
    <svg [style.width.px]="size()" [style.height.px]="size()" viewBox="0 0 24 24" fill="none" stroke="currentColor" [attr.stroke-width]="strokeWidth()" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 4v5h5M20 20v-5h-5" />
      <path d="M5.6 9A8 8 0 0 1 20 12M18.4 15A8 8 0 0 1 4 12" />
    </svg>
  }
  @case ('check') {
    <svg [style.width.px]="size()" [style.height.px]="size()" viewBox="0 0 24 24" fill="none" stroke="currentColor" [attr.stroke-width]="strokeWidth()" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 12l5 5L20 6" />
    </svg>
  }
  @case ('chevron-left') {
    <svg [style.width.px]="size()" [style.height.px]="size()" viewBox="0 0 24 24" fill="none" stroke="currentColor" [attr.stroke-width]="strokeWidth()" stroke-linecap="round" stroke-linejoin="round">
      <path d="M15 18l-6-6 6-6" />
    </svg>
  }
}
