@if (legalModal.openSection(); as section) {
  <div class="legal-modal-backdrop" (click)="legalModal.close()"></div>
  <div class="legal-modal">
    <div class="legal-modal-header">
      <span class="legal-modal-title">{{ 'legal.' + section + '.title' | t }}</span>
      <button
        class="icon-btn legal-modal-close tooltip-below tooltip-align-right"
        type="button"
        [attr.data-tooltip]="'profile.closeToast' | t"
        (click)="legalModal.close()"
      >
        ×
      </button>
    </div>
    <div class="legal-modal-body">{{ 'legal.' + section + '.body' | t }}</div>
  </div>
}
