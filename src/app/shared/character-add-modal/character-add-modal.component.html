@if (characterAddModal.accountId(); as accountId) {
  <div class="character-add-modal-backdrop" (click)="close()"></div>
  <div class="character-add-modal">
    <button
      class="icon-btn character-add-modal-close"
      type="button"
      [appTooltip]="'profile.closeToast' | t"
      tooltipPosition="bottom-right"
      (click)="close()"
    >
      ×
    </button>
    <span class="character-add-modal-icon">
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <circle cx="12" cy="7" r="4" />
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
        <line x1="19" y1="8" x2="19" y2="12" />
        <line x1="17" y1="10" x2="21" y2="10" />
      </svg>
    </span>
    <span class="character-add-modal-title">{{ 'profile.rosterAddCharacter' | t }}</span>
    <p class="character-add-modal-desc">{{ 'profile.rosterDesc' | t }}</p>
    <div class="character-add-modal-form">
      <app-character-add-form (added)="onAdded(accountId, $event)" />
    </div>
  </div>
}
