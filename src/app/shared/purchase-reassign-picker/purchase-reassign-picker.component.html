<div
  class="item-picker-backdrop"
  (click)="close()"
  (contextmenu)="$event.preventDefault(); close()"
  appEscapeClose
  (appEscapeClose)="close()"
></div>
<div
  class="item-picker"
  #picker
  [style.left.px]="displayPosition().left"
  [style.top.px]="displayPosition().top"
>
  <div class="item-picker-title-row">
    <span class="item-picker-title">{{ 'items.interactTitle' | t }}</span>
  </div>
  <div class="item-picker-list">
    <button
      type="button"
      class="item-picker-follow-btn"
      [disabled]="request().isWatched"
      [appTooltip]="request().isWatched ? ('items.alreadyWatched' | t) : null"
      (click)="follow()"
    >
      + {{ 'items.follow' | t }}
    </button>
    @if (showModify()) {
      <span class="purchase-reassign-records-label">{{ 'purchases.reassignLines' | t }}</span>
      <div class="purchase-reassign-records">
        @for (record of request().records; track record.id) {
          <label class="purchase-reassign-record">
            <input
              type="checkbox"
              class="purchase-reassign-record-checkbox"
              [checked]="isSelected(record)"
              (change)="toggleRecord(record)"
            />
            <span class="purchase-reassign-record-time">{{ timeLabel(record) }}</span>
            <span class="purchase-reassign-record-qty">×{{ record.quantity | numberFr }}</span>
            <span class="purchase-reassign-record-cost">{{ record.totalCost | numberFr }} ₭</span>
          </label>
        }
      </div>
      @for (entry of candidates(); track entry.id) {
        <button
          type="button"
          class="item-picker-item"
          [class.current]="isCurrent(entry)"
          [disabled]="isCurrent(entry) || !hasSelection()"
          [appTooltip]="
            !isCurrent(entry) && !hasSelection() ? ('purchases.reassignNoSelection' | t) : null
          "
          (click)="choose(entry)"
        >
          <img class="item-picker-item-rarity" [src]="rarityIconUrl(entry)" alt="" />
          <app-item-icon [name]="label(entry)" [id]="entry.id" [size]="22" />
          <span class="item-picker-name">{{ label(entry) }}</span>
        </button>
      }
    }
  </div>
</div>
