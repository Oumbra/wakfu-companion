<app-page [title]="titleKey() | t" (back)="legalPage.close()">
  <div class="legal-page-content">
    @for (paragraph of paragraphs(); track $index) {
      @if (paragraph.isHeading) {
        <h3 class="legal-page-heading" [innerHTML]="paragraph.text"></h3>
      } @else {
        <p class="legal-page-paragraph" [innerHTML]="paragraph.text"></p>
      }
    }
  </div>
</app-page>
