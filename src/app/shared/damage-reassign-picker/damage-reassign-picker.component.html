<div
  class="damage-reassign-backdrop"
  (click)="close()"
  (contextmenu)="$event.preventDefault(); close()"
></div>
<div
  class="damage-reassign-picker"
  #picker
  [style.left.px]="displayPosition().left"
  [style.top.px]="displayPosition().top"
>
  <div class="damage-reassign-title-row">
    <span class="damage-reassign-title">{{ title() }}</span>
    <div class="icon-switch side-switch">
      <span class="icon-switch-highlight" [class.is-right]="side() === 'enemy'"></span>
      <button
        type="button"
        class="icon-switch-option side-switch-option"
        [class.selected]="side() === 'ally'"
        [attr.data-tooltip]="'damageMeter.allies' | t"
        (click)="setSide('ally')"
      >
        <img [src]="alliesIcon" alt="" class="side-switch-icon" />
      </button>
      <button
        type="button"
        class="icon-switch-option side-switch-option"
        [class.selected]="side() === 'enemy'"
        [attr.data-tooltip]="'damageMeter.enemies' | t"
        (click)="setSide('enemy')"
      >
        <img [src]="enemiesIcon" alt="" class="side-switch-icon" />
      </button>
    </div>
  </div>
  <div class="damage-reassign-list">
    @if (candidates().length === 0) {
      <div class="empty-state small">{{ 'damageMeter.reassignEmpty' | t }}</div>
    } @else {
      @for (row of candidates(); track row.name + '#' + row.instanceIndex) {
        <button class="damage-reassign-item" (click)="choose(row)">
          <app-entity-icon [name]="row.name" [side]="side()" [size]="20" />
          <span class="damage-reassign-name">{{ displayName(row) }}</span>
        </button>
      }
    }
  </div>
</div>
