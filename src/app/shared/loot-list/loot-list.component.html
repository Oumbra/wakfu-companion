@if (items().length === 0) {
  <div class="empty-state small" [class.recap-variant]="emptyVariant() === 'recap'">
    {{ 'damageMeter.noLoot' | t }}
  </div>
} @else {
  <div
    class="loot-list"
    [class.scrollable]="items().length > 5"
    [class.recap-variant]="emptyVariant() === 'recap'"
  >
    @for (item of items(); track item.name; let first = $first) {
      <div
        class="loot-row"
        [class]="rarityClass(item.name)"
        [appTooltip]="!isWatched(item.name) ? ('damageMeter.trackHint' | t) : null"
        [tooltipPosition]="first ? 'bottom' : 'top'"
        (contextmenu)="onContextMenu($event, item.name)"
      >
        <app-item-icon [name]="item.name" />
        <span class="loot-name">{{ i18n.translateItemName(item.name) }}</span>
        <span class="loot-qty">×{{ item.quantity | numberFr }}</span>
      </div>
    }
  </div>
}
