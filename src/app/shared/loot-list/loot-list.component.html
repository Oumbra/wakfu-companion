@if (items().length === 0) {
  <div class="empty-state small" [class.recap-variant]="emptyVariant() === 'recap'">
    {{ 'damageMeter.noLoot' | t }}
  </div>
} @else {
  <div
    class="loot-list"
    [class.scrollable]="items().length > 5"
    [class.recap-variant]="emptyVariant() === 'recap'"
  >
    @for (item of items(); track item.name + '#' + $index; let first = $first) {
      <div
        class="loot-row"
        [class]="rarityClass(item)"
        (contextmenu)="openInteractMenu($event, item)"
      >
        <app-item-icon [name]="item.name" [id]="item.catalogId" />
        <span class="loot-name">{{
          i18n.translateItemNameById(item.catalogId, i18n.translateItemName(item.name))
        }}</span>
        <span class="loot-fix-slot">
          @if (isCorrectable(item)) {
            <button
              type="button"
              class="loot-fix-btn"
              [appTooltip]="'items.correctableTooltip' | t"
              [tooltipPosition]="first ? 'bottom' : 'top'"
              (click)="openInteractMenu($event, item)"
            >
              <app-icon name="wrench" [size]="13" [strokeWidth]="2" />
            </button>
          }
        </span>
        <span class="loot-qty">×{{ item.quantity | numberFr }}</span>
      </div>
    }
  </div>
}
