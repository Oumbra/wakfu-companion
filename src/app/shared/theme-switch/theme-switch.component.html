<div class="theme-switch-wrap" [class.theme-switch-wrap-row]="variant() === 'row'">
  <div class="icon-switch theme-switch">
    <span class="icon-switch-highlight" [class.is-right]="theme.theme() === 'light'"></span>
    <button
      type="button"
      class="icon-switch-option theme-switch-option"
      [class.selected]="theme.theme() === 'dark'"
      [disabled]="theme.theme() === 'dark'"
      [appTooltip]="variant() === 'header' ? ('app.themeDark' | t) : null"
      tooltipPosition="bottom"
      (click)="theme.setTheme('dark')"
    >
      <img [src]="darkIcon" alt="" referrerpolicy="no-referrer" draggable="false" />
    </button>
    <button
      type="button"
      class="icon-switch-option theme-switch-option"
      [class.selected]="theme.theme() === 'light'"
      [disabled]="theme.theme() === 'light'"
      [appTooltip]="variant() === 'header' ? ('app.themeLight' | t) : null"
      tooltipPosition="bottom"
      (click)="theme.setTheme('light')"
    >
      <img [src]="lightIcon" alt="" referrerpolicy="no-referrer" draggable="false" />
    </button>
  </div>
  @if (variant() === 'row') {
    <span class="theme-switch-row-label">{{ 'app.theme' | t }}</span>
  }
</div>
