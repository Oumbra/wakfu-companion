<div
  class="class-picker-backdrop"
  (click)="close()"
  (contextmenu)="$event.preventDefault(); close()"
></div>
<div class="class-picker" [style.left.px]="position().x" [style.top.px]="position().y">
  <div class="class-picker-title">{{ 'damageMeter.classOf' | t }} {{ position().name }}</div>
  <div class="class-picker-grid">
    @for (option of classOptions; track option.key) {
      <button class="class-picker-item" [title]="option.label" (click)="choose(option.key)">
        <img [src]="option.icon" alt="" />
      </button>
    }
  </div>
</div>
