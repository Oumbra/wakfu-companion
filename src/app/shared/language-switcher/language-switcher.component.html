<div class="lang-switcher" [class.lang-switcher-row]="variant() === 'row'">
  <button
    class="lang-current"
    [class.lang-current-row]="variant() === 'row'"
    (click)="toggle()"
    [appTooltip]="variant() === 'header' ? current().label : null"
    tooltipPosition="bottom-right"
  >
    <app-flag-icon class="lang-current-glyph" [country]="current().flagCountry" />
    @if (variant() === 'row') {
      <span class="lang-current-label">{{ 'app.language' | t }}</span>
    }
  </button>
  @if (open()) {
    <div class="lang-backdrop" (click)="close()" appEscapeClose (appEscapeClose)="close()"></div>
    <div class="lang-menu">
      @for (l of locales; track l.code) {
        @if (l.code !== i18n.locale()) {
          <button class="lang-option" (click)="choose(l.code)">
            <app-flag-icon class="lang-flag" [country]="l.flagCountry" />
            <span class="lang-label">{{ l.label }}</span>
          </button>
        }
      }
    </div>
  }
</div>
