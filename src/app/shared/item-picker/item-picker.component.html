<div
  class="item-picker-backdrop"
  (click)="close()"
  (contextmenu)="$event.preventDefault(); close()"
></div>
<div
  class="item-picker"
  #picker
  [style.left.px]="displayPosition().left"
  [style.top.px]="displayPosition().top"
>
  <div class="item-picker-title-row">
    <span class="item-picker-title">{{ 'items.interactTitle' | t }}</span>
  </div>
  <div class="item-picker-list">
    <button
      type="button"
      class="item-picker-follow-btn"
      [disabled]="request().isWatched"
      [appTooltip]="request().isWatched ? ('items.alreadyWatched' | t) : null"
      (click)="follow()"
    >
      + {{ 'items.follow' | t }}
    </button>
    @if (showModify()) {
      <div class="item-picker-modify-row">
        <span class="item-picker-modify-label">{{ 'items.modifyQuantity' | t }}</span>
        <div class="item-picker-qty-stepper">
          <button
            type="button"
            class="item-picker-qty-step"
            [appTooltip]="'items.quantityDecrease' | t"
            (click)="stepQuantity(-1)"
          >
            −
          </button>
          <input
            type="number"
            min="1"
            [attr.max]="request().quantity"
            inputmode="numeric"
            class="item-picker-qty-input"
            [value]="quantity()"
            (input)="onQuantityInput($event)"
            (keydown)="onQuantityKeydown($event)"
            (blur)="onQuantityBlur()"
          />
          <button
            type="button"
            class="item-picker-qty-step"
            [appTooltip]="'items.quantityIncrease' | t"
            (click)="stepQuantity(1)"
          >
            +
          </button>
        </div>
      </div>
      @for (entry of candidates(); track entry.id) {
        <button
          type="button"
          class="item-picker-item"
          [class.current]="isCurrent(entry)"
          [disabled]="isCurrent(entry)"
          (click)="choose(entry)"
        >
          <img class="item-picker-item-rarity" [src]="rarityIconUrl(entry)" alt="" />
          <app-item-icon [name]="label(entry)" [id]="entry.id" [size]="22" />
          <span class="item-picker-name">{{ label(entry) }}</span>
        </button>
      }
    }
  </div>
</div>
