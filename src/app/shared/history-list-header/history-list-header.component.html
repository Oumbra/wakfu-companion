<div class="controls-row">
  <div class="search-wrap">
    <svg
      class="search-icon"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <circle cx="11" cy="11" r="7" />
      <path d="M21 21l-4.3-4.3" />
    </svg>
    <input
      type="text"
      class="search-input"
      [placeholder]="searchPlaceholder()"
      [value]="searchQuery()"
      (input)="searchQueryChange.emit($any($event.target).value)"
    />
  </div>
  <div class="icon-switch sort-switch">
    <span class="icon-switch-highlight" [class.is-right]="sortOrder() === 'asc'"></span>
    <button
      type="button"
      class="icon-switch-option sort-switch-option"
      [class.selected]="sortOrder() === 'desc'"
      [appTooltip]="'purchases.sortNewestFirst' | t"
      tooltipPosition="bottom-right"
      (click)="sortOrderChange.emit('desc')"
    >
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M12 19V5M5 12l7-7 7 7" />
      </svg>
    </button>
    <button
      type="button"
      class="icon-switch-option sort-switch-option"
      [class.selected]="sortOrder() === 'asc'"
      [appTooltip]="'purchases.sortOldestFirst' | t"
      tooltipPosition="bottom-right"
      (click)="sortOrderChange.emit('asc')"
    >
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M12 5v14M19 12l-7 7-7-7" />
      </svg>
    </button>
  </div>
</div>
