<button
  class="profile-btn"
  [class.tooltip-align-right]="variant() === 'header'"
  [class.tooltip-below]="variant() === 'header'"
  [class.profile-btn-row]="variant() === 'row'"
  (click)="open()"
  [attr.title]="variant() === 'header' ? ('profile.button' | t) : null"
>
  @if (profile.avatarIndex() !== null) {
    <app-avatar-icon class="profile-avatar" [index]="profile.avatarIndex()!" />
  } @else {
    <span class="profile-question">?</span>
  }
  @if (variant() === 'row') {
    <span class="profile-btn-label">{{ 'profile.button' | t }}</span>
  }
</button>
