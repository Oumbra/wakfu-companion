<button
  class="profile-btn"
  [class.profile-btn-row]="variant() === 'row'"
  (click)="open()"
  [appTooltip]="variant() === 'header' ? ('profile.button' | t) : null"
  tooltipPosition="bottom-right"
>
  @if (profile.avatarExternalUrl(); as externalUrl) {
    <div class="profile-avatar-wrapper">
      <img class="profile-avatar" [src]="externalUrl" referrerpolicy="no-referrer" alt="" />
    </div>
  } @else if (profile.avatarIndex() !== null) {
    <div class="profile-avatar-wrapper">
      <app-class-portrait
        class="profile-avatar"
        [className]="avatarEntry().className"
        [gender]="avatarEntry().gender"
        [alwaysColored]="true"
      />
    </div>
  } @else {
    <span class="profile-question">?</span>
  }
  @if (variant() === 'row') {
    <span class="profile-btn-label">{{ 'profile.button' | t }}</span>
  }
  <!-- Badge "new" (voir NewSectionBadgeService/CLAUDE.md) : desktop uniquement (variante 'header'
       de ce bouton, jamais 'row' — voir CLAUDE.md), tant qu'au moins une section du rail profil a
       quelque chose de nouveau. -->
  @if (variant() === 'header' && newSectionBadge.hasAnyUnseen()) {
    <span class="profile-new-dot" aria-hidden="true"></span>
  }
</button>
