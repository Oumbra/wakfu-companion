<div class="tool-panel">
  <div class="panel-header">
    <span class="panel-header-label-group">
      <span class="header-label">
        <img [src]="headerIcon" class="header-icon" alt="" />
        {{ 'damageMeter.header' | t }}
      </span>
      <button
        type="button"
        class="icon-btn help-icon-btn"
        [appTooltip]="'help.tooltip' | t"
        tooltipPosition="top"
        (click)="helpModal.open('combat')"
      >
        ?
      </button>
    </span>
    <button
      class="collapse-btn"
      [appTooltip]="'damageMeter.collapseHint' | t"
      tooltipPosition="top"
      (click)="combatPanel.setCollapsed(true)"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="16px"
        height="16px"
        fill="none"
        viewBox="0 0 16 17"
        role="img"
        aria-hidden="true"
      >
        <path
          fill="currentColor"
          fill-rule="evenodd"
          d="M1.75 1.75A.75.75 0 0 0 1 2.5V15c0 .41.34.75.75.75H15v-1.5H5.5v-11H15v-1.5zM4 3.25H2.5v11H4zM9.81 9.5l1.22 1.22-1.06 1.06-2.5-2.5-.53-.53.53-.53 2.5-2.5 1.06 1.06L9.81 8H14v1.5z"
          clip-rule="evenodd"
        ></path>
      </svg>
    </button>
  </div>

  <div class="panel-body meter-body">
    @if (activeFightIds().length > 1) {
      <div class="fight-tabs-row">
        @for (id of activeFightIds(); track id; let i = $index) {
          <button
            type="button"
            class="fight-tab"
            [class.selected]="id === displayedFightId()"
            (click)="selectFight(id)"
          >
            {{ tabLabel(i) }}
          </button>
        }
      </div>
    }
    @if (hasCurrentFight()) {
      <div class="fight-stats-row">
        <span class="fight-turns">{{ currentFightTurns() }} {{ 'damageMeter.turns' | t }}</span>
        <span class="fight-stats-sep">|</span>
        <span class="fight-duration">{{ formatDuration(currentFightDurationMs()) }}</span>
      </div>
      <div class="view-switch-row">
        <app-damage-view-switch
          [mode]="viewMode()"
          [turn]="effectiveTurn()"
          [maxTurn]="currentFightTurns()"
          (modeChange)="setViewMode($event)"
          (turnChange)="setTurn($event)"
        />
      </div>
    }
    <app-entity-damage-list
      [title]="'damageMeter.allies' | t"
      side="ally"
      [rows]="allyRows()"
      [fightId]="displayedFightId()"
      [interactive]="true"
      [viewMode]="viewMode()"
      [turn]="effectiveTurn()"
      [emptyMessage]="'damageMeter.emptyAllies' | t"
    />
    <app-entity-damage-list
      [title]="'damageMeter.enemies' | t"
      side="enemy"
      [rows]="enemyRows()"
      [fightId]="displayedFightId()"
      [interactive]="true"
      [viewMode]="viewMode()"
      [turn]="effectiveTurn()"
      [emptyMessage]="'damageMeter.emptyEnemies' | t"
    />
  </div>
</div>
