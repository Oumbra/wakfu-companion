<div class="dashboard">
  <app-tracker-strip />

  <div class="tab-bar">
    <div
      class="tab-slider"
      [style.--active-tab-index]="activeTabIndex()"
      [style.--tab-count]="tabCount()"
    ></div>
    @if (combatPanel.hasActiveFight()) {
      <button
        class="tab-btn"
        [class.active]="activeTab() === 'damage'"
        (click)="activeTab.set('damage')"
      >
        {{ 'damageMeter.header' | t }}
      </button>
    }
    <button
      class="tab-btn"
      [class.active]="activeTab() === 'tracker'"
      (click)="activeTab.set('tracker')"
    >
      {{ 'tracker.header' | t }}
      <button
        type="button"
        class="icon-btn help-icon-btn tooltip-below"
        [attr.data-tooltip]="'help.tooltip' | t"
        (click)="helpModal.open('tracker')"
      >
        ?
      </button>
    </button>
    <button
      class="tab-btn"
      [class.active]="activeTab() === 'history'"
      (click)="activeTab.set('history')"
    >
      {{ 'history.header' | t }}
    </button>
    <button
      class="tab-btn"
      [class.active]="activeTab() === 'chat'"
      (click)="activeTab.set('chat')"
    >
      {{ 'chat.header' | t }}
      <button
        type="button"
        class="icon-btn help-icon-btn tooltip-below tooltip-align-right"
        [attr.data-tooltip]="'help.tooltip' | t"
        (click)="helpModal.open('chat')"
      >
        ?
      </button>
    </button>
  </div>
  <div class="panels-row" [class.has-combat]="combatPanel.hasActiveFight() && !combatPanel.collapsed()">
    @if (combatPanel.hasActiveFight() && !combatPanel.collapsed()) {
      <app-damage-meter [class.tab-hidden]="activeTab() !== 'damage'" />
    }
    <app-tracker [class.tab-hidden]="activeTab() !== 'tracker'" />
    <app-history [class.tab-hidden]="activeTab() !== 'history'" />
    <app-chat-panel [class.tab-hidden]="activeTab() !== 'chat'" />
  </div>
</div>
