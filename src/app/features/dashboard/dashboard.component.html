<app-dashboard-rail />
<div class="dashboard" [attr.data-kpi-pos]="layout.kpiPos()">
  <app-tracker-strip />

  <div class="dashboard-main">
    <app-tab-bar
      [items]="tabItems()"
      [activeId]="activeTab()"
      (activeIdChange)="selectTab($event)"
      [mobileOnly]="true"
    />
    <div
      class="panels-row"
      [style.grid-template-columns]="layout.panelsColumns()"
      [style.grid-template-rows]="'repeat(' + layout.panelsRowCount() + ', minmax(0, 1fr))'"
    >
      <app-tracker
        [class.tab-hidden]="activeTab() !== 'tracker'"
        [style.grid-column]="layout.gridPlan()['tracker'].gridColumn"
        [style.grid-row]="layout.gridPlan()['tracker'].gridRow"
        [style.order]="layout.gridPlan()['tracker'].order"
      />
      <app-history [class.tab-hidden]="activeTab() !== 'history'" />
      @if (!layout.isCollapsed('recap')) {
        <!-- class="tab-hidden" statique (pas de binding) : Récap n'a pas d'onglet dédié dans la
             barre mobile (voir TAB_ORDER/DashboardComponent, tracker/history/chat seulement) ni de
             rail replié en dessous de 800px (voir dashboard-rail.component.css) — sans ce
             masquage, une carte laissée dépliée sur desktop (préférence synchronisée compte)
             s'afficherait en permanence, empilée par-dessus l'onglet mobile actif. La règle CSS
             `.panels-row > .tab-hidden` (dashboard.component.css) n'a d'effet que sous 800px :
             aucun impact desktop. -->
        <app-session-recap
          class="tab-hidden"
          [style.grid-column]="layout.gridPlan()['recap'].gridColumn"
          [style.grid-row]="layout.gridPlan()['recap'].gridRow"
          [style.order]="layout.gridPlan()['recap'].order"
        />
      }
      <app-chat-panel
        [class.tab-hidden]="activeTab() !== 'chat'"
        [class.panel-collapsed]="chatPanel.collapsed()"
        [style.grid-column]="layout.gridPlan()['chat'].gridColumn"
        [style.grid-row]="layout.gridPlan()['chat'].gridRow"
        [style.order]="layout.gridPlan()['chat'].order"
      />
    </div>
  </div>
</div>
