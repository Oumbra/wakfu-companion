<div class="tool-panel">
  <div class="panel-header">
    <span class="header-label">
      <app-icon name="clock" [strokeWidth]="1.8" [size]="18" />
      {{ 'history.header' | t }}
    </span>
  </div>

  <div class="tab-header">
    <div class="meter-tab" [class.active]="activeTab() === 'combats'">
      <button type="button" class="meter-tab-label" (click)="activeTab.set('combats')">
        {{ 'history.tabCombats' | t }}
      </button>
      <button
        type="button"
        class="icon-btn help-icon-btn meter-tab-help-btn"
        [attr.data-tooltip]="'help.tooltip' | t"
        (click)="helpModal.open('fightHistory')"
      >
        ?
      </button>
    </div>
    <div class="meter-tab" [class.active]="activeTab() === 'purchases'">
      <button type="button" class="meter-tab-label" (click)="activeTab.set('purchases')">
        {{ 'purchases.header' | t }}
      </button>
      <button
        type="button"
        class="icon-btn help-icon-btn meter-tab-help-btn"
        [attr.data-tooltip]="'help.tooltip' | t"
        (click)="helpModal.open('purchases')"
      >
        ?
      </button>
    </div>
    <div class="meter-tab" [class.active]="activeTab() === 'trades'">
      <button type="button" class="meter-tab-label" (click)="activeTab.set('trades')">
        {{ 'trades.header' | t }}
      </button>
      <button
        type="button"
        class="icon-btn help-icon-btn meter-tab-help-btn tooltip-align-right"
        [attr.data-tooltip]="'help.tooltip' | t"
        (click)="helpModal.open('trades')"
      >
        ?
      </button>
    </div>
  </div>

  @if (canShowAccount()) {
    <div class="history-source">
      <button
        type="button"
        class="history-source-btn"
        [class.active]="!archive.showsAccount()"
        [title]="'history.source.sessionTooltip' | t"
        (click)="showSource('session')"
      >
        {{ 'history.source.session' | t }}
      </button>
      <button
        type="button"
        class="history-source-btn"
        [class.active]="archive.showsAccount()"
        [title]="'history.source.accountTooltip' | t"
        (click)="showSource('account')"
      >
        {{ 'history.source.account' | t }}
      </button>
      @if (archive.loading()) {
        <span class="history-source-status">{{ 'history.source.loading' | t }}</span>
      } @else if (archive.failed()) {
        <span class="history-source-status error">{{ 'history.source.error' | t }}</span>
      }
    </div>
  }

  @if (activeTab() === 'combats') {
    <app-fight-history />
  } @else if (activeTab() === 'purchases') {
    <app-purchases />
  } @else {
    <app-trades />
  }

  @if (hasMore()) {
    <div class="history-load-more">
      <button type="button" (click)="loadMore()" [disabled]="archive.loading()">
        {{ 'history.source.loadMore' | t }}
      </button>
    </div>
  }
</div>
