<div class="character-add-form">
  <button
    class="character-add-class-trigger"
    type="button"
    [appTooltip]="'profile.rosterPickClass' | t"
    (click)="openClassPicker($event)"
  >
    @if (avatarIndex() !== null) {
      <app-avatar-icon [index]="avatarIndex()!" />
    } @else {
      <div class="class-trigger-filmstrip" aria-hidden="true">
        @for (i of filmstripIndices; track $index) {
          <app-avatar-icon [index]="i" />
        }
      </div>
    }
  </button>
  <div class="character-add-fields">
    <input
      type="text"
      class="character-add-name-input"
      [placeholder]="'profile.rosterCharacterNamePlaceholder' | t"
      [value]="name()"
      (input)="setName($any($event.target).value)"
      (keydown.enter)="commit(); $event.preventDefault()"
    />
    <button
      class="primary-btn character-add-submit-btn"
      type="button"
      [disabled]="!canAdd()"
      (click)="commit()"
    >
      {{ 'tracker.add' | t }}
    </button>
  </div>
</div>
