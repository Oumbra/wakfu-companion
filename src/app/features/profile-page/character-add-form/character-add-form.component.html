<div class="character-add-form">
  <button
    class="icon-btn roster-class-pick-btn"
    type="button"
    [appTooltip]="'profile.rosterPickClass' | t"
    (click)="openClassPicker($event)"
  >
    <img [src]="icon()" alt="" class="roster-class-pick-icon" />
  </button>
  <input
    type="text"
    class="roster-character-name-input"
    [placeholder]="'profile.rosterCharacterNamePlaceholder' | t"
    [value]="name()"
    (input)="setName($any($event.target).value)"
    (keydown.enter)="commit(); $event.preventDefault()"
  />
  <button
    class="icon-btn roster-character-add-btn"
    type="button"
    [disabled]="!canAdd()"
    [appTooltip]="'tracker.add' | t"
    (click)="commit()"
  >
    +
  </button>
</div>
