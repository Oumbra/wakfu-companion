<div class="app-shell">
  <header class="app-header">
    <div class="app-title">Wakfu Companion</div>
    <div class="app-header-right">
      @if (logFileAccess.status() === 'connected') {
        <div class="app-header-actions">
          <span class="file-chip">{{ logFileAccess.fileName() }}</span>
          @if (logFileAccess.usingClassicPicker()) {
            <button
              class="icon-btn"
              [title]="'app.refresh' | t"
              (click)="classicRefreshInput.click()"
            >
              ↻
            </button>
          }
          <button class="icon-btn" [title]="'app.changeFile' | t" (click)="onChangeFile()">
            ⇄
          </button>
          <button class="toggle-btn" (click)="sessionRecap.toggle()">
            {{ 'app.sessionRecap' | t }}
          </button>
          <button class="reset-btn" (click)="onReset()">{{ 'app.reset' | t }}</button>
        </div>
      }
      <app-language-switcher />
      <app-profile />
    </div>
  </header>

  <main class="app-main">
    @if (logFileAccess.status() === 'connected') {
      <app-dashboard />
    } @else {
      <app-setup />
    }
  </main>

  <app-session-recap #sessionRecap />
  <app-loot-alert />

  <input
    #classicRefreshInput
    type="file"
    accept=".log,.txt"
    style="display: none"
    (change)="onClassicRefreshSelected($event)"
  />
</div>
