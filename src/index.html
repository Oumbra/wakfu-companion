<!doctype html>

    <!-- Requis depuis l'introduction des URLs préfixées par langue (`/fr/profile`, `/en/account`...
         — voir app.routes.ts) : sans `<base href>`, le navigateur résout les URLs relatives
         (`styles.css`, `main.js`...) par rapport au chemin COURANT, pas à la racine du site — sur un
         chemin à un seul segment (`/profile`, comme avant cette fonctionnalité) ça donnait par
         hasard la bonne URL (`/styles.css`), mais sur un chemin à deux segments (`/fr/profile`) ça
         résout en `/fr/styles.css`, une 404 qui casse le chargement de toute l'app. `ng build
         --base-href /wakfu-companion/` (voir deploy-main.yml, GitHub Pages) réécrit cette balise à la
         volée pour la prod ; le build preview Cloudflare (deploy-preview.yml, servi à la racine de
         son domaine) et le serveur de dev gardent celle-ci telle quelle. -->
    <base href="/" />
    <title>Wakfu Companion — Tracker de combat, historique et suivi en temps réel</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#00d2ff" />

    <!-- ═══════════════════════ SEO / référencement (moteurs classiques + IA) ═══════════════════════
         Domaine canonique en dur ci-dessous (GH Pages, hébergement de prod actuel — voir
         docs/plan-migration-serveur.md) : À METTRE À JOUR PARTOUT (ce fichier, public/robots.txt,
         public/sitemap.xml, public/llms.txt, core/services/seo.service.ts) le jour où la prod bascule
         sur Cloudflare/domaine personnalisé. Volontairement en dur (canonical/og:url identiques sur
         TOUTES les URLs de déploiement, y compris les previews *.pages.dev) : ça dit explicitement
         aux moteurs "n'indexe pas cette URL séparément, c'est un doublon de la prod" — technique
         standard pour un environnement de preview/staging, sans avoir besoin de config par
         environnement.
         Le titre/la description ci-dessous sont repris (mêmes clés `seo.*`) et mis à jour
         dynamiquement par page/langue une fois l'app démarrée (voir core/services/seo.service.ts) ;
         ce contenu STATIQUE reste ce que voient les crawlers qui n'exécutent PAS de JavaScript
         (GPTBot, ClaudeBot, PerplexityBot, CCBot...), d'où l'importance qu'il soit correct et
         suffisant à lui seul.
         Balises hreflang : l'app propose désormais une URL DISTINCTE par langue (`/fr`, `/en`, `/es`,
         `/pt`, voir app.routes.ts) — hreflang a donc du sens ici. Le canonical/les alternates
         ci-dessous restent volontairement figés sur l'accueil racine (pas de version par page) : un
         crawler qui n'exécute pas de JS ne voit de toute façon toujours que CE fichier statique quel
         que soit le chemin réellement demandé (identique pour /, /fr, /profile...), donc lui fournir
         des variantes par langue reste utile, des variantes par sous-page ne le serait pas (même
         contenu HTML servi dans tous les cas). `SeoService` prend le relais une fois l'app démarrée
         pour les moteurs qui exécutent le JS (Google, Bing) : canonical/alternates mis à jour selon
         la locale ACTIVE (voir son commentaire) — cette même URL statique de repli fait office de
         valeur par défaut avant que le JS ne s'exécute. -->
    <link rel="alternate" hreflang="fr" href="https://oumbra.github.io/wakfu-companion/fr" />

    <!-- Contrairement à main-*.js/styles-*.css (hashés via outputHashing,
       voir angular.json), ce fichier index.html garde toujours le même nom :
       sans ces en-têtes, le navigateur peut continuer à servir une version
       mise en cache après un nouveau déploiement (référençant des noms de
       bundle qui ont changé ou disparu), donnant l'impression qu'un correctif
       "revient en arrière". -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="manifest" href="manifest.webmanifest" />
    <!-- Pose data-theme AVANT le premier rendu (voir ThemeService, même clé/logique de détection) :
         sans ça, un visiteur en thème système clair verrait un flash du thème sombre par défaut le
         temps qu'Angular démarre et instancie le service. -->
    <script>
      (function () {
        try {
          var stored = JSON.parse(localStorage.getItem('wakfu-theme') || 'null');
          var theme =
            stored === 'dark' || stored === 'light'
              ? stored
              : window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark';
          document.documentElement.dataset.theme = theme;
        } catch (e) {
          /* localStorage indisponible (mode privé strict...) : reste sur le thème sombre par défaut. */
        }
      })();
    </script>
