<svg xmlns="http://www.w3.org/2000/svg">
  <!-- Sprite d'icônes partagées, point d'entrée unique : shared/icon/icon.component.ts.
       Chaque <symbol> ne porte aucun fill/stroke/stroke-width propre : ces valeurs sont
       posées sur le <svg> appelant (voir icon.component.html) et héritent dans le contenu
       cloné par <use>, ce qui préserve currentColor et le strokeWidth paramétrable. -->
