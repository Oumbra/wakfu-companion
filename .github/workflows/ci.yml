name: CI

on:
  push:
    branches:
      - main
      - claude/dev
  pull_request:
  # Appelé aussi par deploy-main.yml (job `ci`) : la production ne se déploie
  # qu'après ces vérifications, rejouées sur le commit exact à déployer.
  workflow_call:

# Moindre privilège : le job ne fait que lire le dépôt (aucun push, aucun
# secret). Appelé depuis deploy-main.yml, il hérite au plus des permissions du
# job appelant (`contents: read` là aussi).
permissions:
  contents: read

# `github.workflow` : dans un workflow appelé (`workflow_call`), il vaut le nom
# du workflow APPELANT. Sans lui, le run autonome « CI » d'un push sur main et
# le job `ci` de deploy-main.yml (même ref) partageraient le groupe et
# `cancel-in-progress` annulerait l'un par l'autre — donc le déploiement.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Aucun job ne pousse avec git : ne pas laisser le GITHUB_TOKEN dans .git/config.
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Les tables générées (src/app/core/data/wakfu-{items,monsters,dungeons}.data.ts)
      # sont dans .gitignore : absentes d'un checkout propre. `npm test` et
      # `npm run build` les régénèrent eux-mêmes via `npm run generate`, mais
      # prettier tourne avant et doit voir le même périmètre de fichiers qu'en
      # local, où elles existent (elles sont conformes au format Prettier).
      - name: Generate data tables
        run: npm run generate

      # Refuse un journal wakfu.log ou un export réel dans tests/ (dépôt public, données de
      # joueurs) — voir tools/check-fixtures.mjs. Aussi en hook pre-commit ; la CI fait foi.
      - name: Check test fixtures are pseudonymised
        run: node tools/check-fixtures.mjs

      - name: Check formatting
        run: npx prettier --check "src/**/*.{ts,html,css}" "server/**/*.ts" "functions/**/*.ts"

      # `--watch=false` : le builder `@angular/build:unit-test` d'Angular 21
      # n'accepte pas `--run` (option Vitest). Hors TTY le défaut est déjà
      # false, on le fixe explicitement pour ne pas dépendre du runner.
      - name: Run tests
        run: npm test -- --watch=false

      # Tests du code serveur (server/**/*.spec.ts) — pipeline distinct de
      # `npm test` (builder Angular, src/ uniquement), voir
      # vitest.server.config.ts.
      - name: Run server tests
        run: npm run test:server

      - name: Build
        run: npm run build

      # tsconfig.app.json ne couvre que src/ (voir son "include") : le code
      # serveur (functions/, server/) a son propre tsconfig, jamais compilé
      # ni vérifié par `ng build`/`ng test` — sans cette étape, une erreur de
      # type dans les Pages Functions ne serait détectée qu'au déploiement.
      - name: Type-check server
        run: npx tsc -p tsconfig.server.json --noEmit

      # server/import/ cible le runtime Node (via tsx), pas Workers/edge —
      # tsconfig dédié (voir tsconfig.import.json), donc vérification séparée.
      - name: Type-check import script
        run: npx tsc -p tsconfig.import.json --noEmit
