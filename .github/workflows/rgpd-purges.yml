# Purges de conservation quotidiennes (RGPD art. 5.1.e) — `docs/analyse-rgpd.md`, écart 4.13.
#
# Pourquoi un workflow planifié : toutes les purges du service sont opportunistes (Cloudflare Pages
# n'offre pas de Cron Trigger, voir server/README.md) — elles ne tournent qu'à l'occasion d'un appel
# d'authentification. Sans trafic, les durées annoncées par la politique de confidentialité (§5)
# cessent d'être tenues : un compte inactif depuis plus de 12 mois survit jusqu'à ce que quelqu'un
# d'autre se connecte, et la dernière fenêtre de comptage anti-abus reste en base indéfiniment.
#
# Ce job exécute `server/import/run-retention-purges.ts`, qui appelle `runFullPurge` : les délais
# eux-mêmes restent définis dans `server/auth/flow.ts`, jamais ici.
#
# Limites connues, identiques à `rgpd-revision-annuelle.yml` :
# - un `schedule` ne tourne que depuis la branche par défaut (`main`) — inactif tant que
#   `claude/dev` n'y est pas fusionnée ;
# - GitHub désactive les workflows planifiés d'un dépôt public sans commit depuis 60 jours
#   (courriel d'avertissement, réactivation en un clic dans l'onglet Actions). Un run manqué n'a
#   aucune conséquence irréversible : la purge suivante rattrape tout ce qui a dépassé son délai.
# `workflow_dispatch` permet de le déclencher à la main (test, rattrapage).
name: RGPD — purges de conservation

on:
  schedule:
    # Tous les jours à 03:20 UTC — creux de fréquentation, et décalé des minutes rondes (GitHub
    # concentre la charge à :00, d'où des démarrages retardés).
    - cron: '20 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

# Jamais deux purges en parallèle sur la même base : `cancel-in-progress: false` laisse la
# première finir plutôt que d'interrompre une suppression en cours.
concurrency:
  group: rgpd-purges
  cancel-in-progress: false

jobs:
  purge:
    # Base de PRODUCTION : jamais depuis une autre ref (un `workflow_dispatch` peut viser n'importe
    # quelle branche ; `schedule` tourne toujours sur main). Même environnement que deploy-main.yml,
    # dont la règle de branche est la vraie barrière.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    # Une purge bloquée (base injoignable, verrou) ne doit pas occuper un runner 6 h.
    timeout-minutes: 15
    permissions:
      contents: read
      # Étape « Signaler l'échec » seulement : ouvrir une issue quand la purge échoue.
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          # setup-node >= v5 active seul le cache npm (champ packageManager) : job porteur de
          # secrets, pas de cache restauré (risque d'empoisonnement de cache).
          package-manager-cache: false

      # `--ignore-scripts` : job porteur de DATABASE_URL (production), voir deploy-main.yml.
      # `npm rebuild esbuild` : tsx s'appuie sur esbuild.
      - name: Install dependencies
        run: |
          npm ci --ignore-scripts
          npm rebuild esbuild

      # Base de PRODUCTION (même secret que deploy-main.yml). La branche Neon de preview n'a pas
      # de purge planifiée : ses données sont de test et sa branche est recréée à volonté.
      - name: Run retention purges (production)
        run: npx tsx server/import/run-retention-purges.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # Un run planifié qui échoue ne prévient personne (courriel GitHub seulement si l'on y est
      # abonné) : les durées de la politique de confidentialité cesseraient d'être tenues sans
      # bruit. Une issue ouverte (une seule à la fois) rend l'échec visible.
      - name: Signaler l'échec
        if: failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const title = 'RGPD — échec des purges de conservation';
            const { data: open } = await github.rest.issues.listForRepo({
              ...context.repo,
              state: 'open',
              per_page: 100,
            });
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const existing = open.find((issue) => issue.title === title && !issue.pull_request);
            if (existing) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: existing.number,
                body: `Nouvel échec : ${run}`,
              });
              return;
            }
            await github.rest.issues.create({
              ...context.repo,
              title,
              assignees: [context.repo.owner],
              body:
                `Le run planifié des purges de conservation a échoué : ${run}\n\n` +
                `Le journal de l'étape « Run retention purges » liste chaque purge en échec. Les ` +
                `autres purges ont tourné. Fermer l'issue une fois la cause corrigée et un run ` +
                `relancé avec succès (workflow_dispatch).`,
            });
