name: Release

# Mise en prod automatisée à partir d'une branche de release poussée par le skill `release`
# (.claude/skills/release/SKILL.md) : `release-AAAA-MM-JJ` (suffixe `-2`, `-3`... pour une 2e
# release le même jour), créée depuis `main`, dans laquelle `claude/dev` a déjà été fusionnée et
# les conflits éventuels résolus. Les filtres `branches` de GitHub sont des globs, pas des regex :
# ils prennent tout `release-*`, et chaque job vérifie le format exact (RELEASE_BRANCH_REGEX).
#
# Déroulé :
# 1. push de la branche : job `open-pr` — ouvre la PR vers `main`, description = corps du commit
#    de merge (rapport du skill : commits livrés, conflits résolus). En parallèle, ci.yml tourne
#    sur ce même push et produit le check requis `test` (voir la liste de branches de ci.yml).
# 2. fin du run CI vert sur la branche : job `merge-and-deploy` — fusionne la PR en merge commit,
#    lance deploy-main.yml, supprime la branche.
#
# Tout passe par le GITHUB_TOKEN, sans GitHub App ni PAT, d'où deux contournements :
# - une PR créée ou fusionnée par le GITHUB_TOKEN ne déclenche aucun workflow : pas de CI sur
#   l'événement `pull_request` (le run sur push fournit le check), et pas de deploy-main.yml sur
#   le push vers `main` que produit la fusion — d'où le `gh workflow run` explicite
#   (`workflow_dispatch` est l'exception que le GITHUB_TOKEN a le droit de déclencher) ;
# - fusion déclenchée par `workflow_run` plutôt que par l'auto-merge GitHub : l'auto-merge activé
#   par le GITHUB_TOKEN fusionne en silence, sans aucun événement exploitable pour lancer le
#   déploiement.
#
# Prérequis dépôt : Settings → Actions → General → « Allow GitHub Actions to create and approve
# pull requests » (création de la PR). `workflow_run` exécute la version de ce fichier présente
# sur la branche par défaut : le job `merge-and-deploy` n'existe qu'une fois ce fichier arrivé
# sur `main` (la toute première release qui l'apporte se fusionne donc à la main).

on:
  push:
    branches:
      - 'release-*'
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches:
      - 'release-*'

# Pas de groupe `concurrency` : GitHub n'y garde qu'un seul run en attente, un push arrivant
# pendant la fusion pourrait annuler l'un des deux. `--match-head-commit` suffit à éviter de
# fusionner un commit que la CI n'a pas validé.
permissions:
  contents: read

env:
  RELEASE_BRANCH_REGEX: '^release-[0-9]{4}-[0-9]{2}-[0-9]{2}(-[0-9]+)?$'

jobs:
  open-pr:
    # `deleted` : la suppression de la branche (fin de `merge-and-deploy`) émet aussi un push.
    if: github.event_name == 'push' && !github.event.deleted
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      BRANCH: ${{ github.ref_name }}
      # Passé par variable d'environnement, jamais interpolé dans le script (injection).
      MESSAGE: ${{ github.event.head_commit.message }}
    steps:
      - name: Open pull request to main
        run: |
          if ! [[ "$BRANCH" =~ $RELEASE_BRANCH_REGEX ]]; then
            echo "::notice::$BRANCH ne respecte pas le format release-AAAA-MM-JJ(-N) : ignorée."
            exit 0
          fi
          existing=$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            echo "PR #$existing déjà ouverte pour $BRANCH : mise à jour par ce push, rien à créer."
            exit 0
          fi
          # Corps du commit de merge (sans la ligne de sujet) = rapport du skill `release`.
          {
            printf '%s\n' "$MESSAGE" | tail -n +2
            printf '\n---\nPR ouverte par release.yml : fusion automatique dès que le check `test` est vert, puis déploiement de production (deploy-main.yml).\n'
          } > body.md
          gh pr create --base main --head "$BRANCH" --title "chore(release): $BRANCH" --body-file body.md

  merge-and-deploy:
    # `event == 'push'` : seul un run CI issu d'un push dans ce dépôt compte (jamais celui d'une
    # PR, a fortiori venant d'un fork).
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      BRANCH: ${{ github.event.workflow_run.head_branch }}
      SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Merge pull request
        id: merge
        run: |
          if ! [[ "$BRANCH" =~ $RELEASE_BRANCH_REGEX ]]; then
            echo "::notice::$BRANCH ne respecte pas le format release-AAAA-MM-JJ(-N) : ignorée."
            echo "merged=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          pr=$(gh pr list --head "$BRANCH" --base main --state open --json number,headRefOid --jq '.[0] // empty')
          if [ -z "$pr" ]; then
            echo "::error::Aucune PR ouverte de $BRANCH vers main (job open-pr en échec ?)."
            exit 1
          fi
          number=$(jq -r .number <<<"$pr")
          head=$(jq -r .headRefOid <<<"$pr")
          # Un push plus récent sur la branche : c'est le run CI de ce nouveau commit qui fusionnera.
          if [ "$head" != "$SHA" ]; then
            echo "::notice::CI verte sur $SHA mais la PR #$number pointe sur $head : fusion laissée au run CI de $head."
            echo "merged=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh pr merge "$number" --merge --match-head-commit "$SHA"
          echo "merged=true" >> "$GITHUB_OUTPUT"
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Deploy production
        if: steps.merge.outputs.merged == 'true'
        env:
          NUMBER: ${{ steps.merge.outputs.number }}
        run: |
          gh workflow run deploy-main.yml --ref main
          gh pr comment "$NUMBER" --body "Fusionnée dans \`main\`, déploiement de production lancé : https://github.com/$GH_REPO/actions/workflows/deploy-main.yml"

      - name: Delete release branch
        if: steps.merge.outputs.merged == 'true'
        run: gh api -X DELETE "repos/$GH_REPO/git/refs/heads/$BRANCH"
