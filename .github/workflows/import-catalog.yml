name: Import catalog

on:
  push:
    branches:
      - master
      - claude/dev
    paths:
      - 'referentiel/**'
  # Déclenchement manuel : utile pour rejouer un import sans toucher au
  # référentiel (ex. après une migration de schéma catalogue), ou si
  # l'événement push n'a pas déclenché le workflow (voir l'incident GitHub
  # Actions du 2026-08-06, docs/plan-migration-serveur.md).
  workflow_dispatch:

concurrency:
  group: import-catalog-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      # master -> DATABASE_URL (branche Neon production), claude/dev ->
      # DATABASE_URL_PREVIEW (branche Neon dédiée, voir server/README.md) —
      # jamais la même base pour les deux, même règle que
      # deploy-preview.yml/deploy-main.yml pour les migrations.
      - name: Import catalog
        run: npm run catalog:import
        env:
          DATABASE_URL: ${{ github.ref_name == 'master' && secrets.DATABASE_URL || secrets.DATABASE_URL_PREVIEW }}
