name: Deploy main (Cloudflare Pages)

on:
  push:
    branches:
      - main
  # Déclenchement manuel via l'API (dispatch direct), indépendant de la
  # livraison webhook des push — utile pendant l'incident GitHub Actions du
  # 2026-08-06 (webhooks throttled), qui empêchait tout run de démarrer même
  # sur un push tout neuf.
  workflow_dispatch:

# Permissions minimales au niveau du workflow ; `deployments: write` n'est
# accordé qu'au job de déploiement (GitHub Deployments via wrangler-action).
permissions:
  contents: read

# Groupe de concurrence PROPRE au déploiement de production — jamais le même que
# celui de `deploy-preview.yml`. Un groupe est un espace de noms à l'échelle du
# DÉPÔT, pas du workflow : partager `preview-deploy` entre les deux sérialisait
# prod et preview (l'une attendait l'autre sans raison), et surtout GitHub ne
# garde qu'UN SEUL run en attente par groupe — un push sur `claude/dev` pendant
# qu'un déploiement tournait pouvait donc annuler silencieusement le
# déploiement de production qui patientait derrière.
concurrency:
  group: main-deploy
  cancel-in-progress: false

jobs:
  # Vérifications complètes (fixtures, format, tests front/serveur, build,
  # type-check) rejouées via ci.yml en workflow réutilisable sur le commit à
  # déployer : aucune migration de la base de production ni aucun déploiement
  # si l'une échoue. Aucun secret transmis (pas de `secrets: inherit`).
  ci:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build-and-deploy:
    needs: ci
    # Garde de ref : un `workflow_dispatch` lancé depuis une autre branche ne
    # touche jamais la production. La vraie barrière reste la règle de branche
    # de l'environnement GitHub `production` (Settings → Environments), qui
    # tient même si un commit malveillant retire cette ligne.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Secrets de production portés par l'environnement `production` (à y
    # déplacer depuis les secrets de dépôt, procédure dans server/README.md).
    environment: production
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Aucun push git dans ce job : ne pas laisser le GITHUB_TOKEN dans .git/config.
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      # `--ignore-scripts` : job porteur des secrets de production — aucun script
      # d'installation d'une dépendance (transitive, potentiellement compromise)
      # ne s'exécute à côté d'eux. Les seuls paquets du lockfile qui en déclarent
      # (hasInstallScript) : esbuild (x3 versions), workerd, lmdb,
      # msgpackr-extract, @parcel/watcher, fsevents. Tous résolvent leur binaire
      # via un paquet optionnel par plateforme (@esbuild/linux-x64,
      # @cloudflare/workerd-linux-64, @lmdb/..., prebuilds) : leur script ne fait
      # que vérifier/optimiser. `npm rebuild` rejoue ceux d'esbuild (ng build,
      # tsx, drizzle-kit, bundling des Functions par wrangler) et de workerd
      # (wrangler) par prudence ; le `prepare` husky (hooks git locaux) est
      # volontairement sauté, inutile en CI.
      - name: Install dependencies
        run: |
          npm ci --ignore-scripts
          npm rebuild esbuild workerd

      - name: Generate data tables
        run: npm run generate

      # Branche Neon de PRODUCTION (voir server/README.md) : DATABASE_URL,
      # secret distinct de DATABASE_URL_PREVIEW (utilisé par la preview, voir
      # deploy-preview.yml). Migrations jouées AVANT le build/déploiement du front.
      - name: Run DB migrations (production)
        run: npm run db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # Garde-fou : "drizzle-kit migrate" peut annoncer un succès sans avoir
      # réellement tout appliqué (vécu le 2026-08-12, voir le commentaire en
      # tête de server/db/verify-migrations.ts) — fait échouer le job plutôt
      # que de déployer silencieusement sur un schéma en retard.
      - name: Verify DB migrations (production)
        run: npm run db:verify-migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # Pas de --base-href custom : Cloudflare Pages sert ce projet à la
      # racine de son domaine, la balise <base href="/"> de src/index.html
      # convient donc telle quelle.
      - name: Build
        run: npx ng build

      # Rend DATABASE_URL disponible à l'exécution dans les Pages
      # Functions (functions/api/v1/*, context.env.DATABASE_URL) — distinct
      # des secrets GitHub Actions ci-dessus, qui ne servent qu'au moment du
      # build/CI. --env production cible l'environnement de production du
      # projet Cloudflare Pages.
      - name: Push DB secret to Cloudflare Pages (production)
        run: echo "$DATABASE_URL" | npx wrangler pages secret put DATABASE_URL --project-name wakfu-companion --env production
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Identifiants OAuth Discord/Google + origine publique (lot 5, prompt 5.1, voir
      # functions/api/_auth.ts). Chaque secret est poussé SEULEMENT s'il est défini : tant qu'une
      # application OAuth n'est pas créée côté fournisseur, les routes /auth/{provider}/* répondent
      # 503 « fournisseur non configuré » et le reste de l'application (mode invité) est intact —
      # jamais un déploiement en échec pour un secret manquant.
      - name: Push OAuth secrets to Cloudflare Pages (production)
        run: |
          push_secret() {
            if [ -n "$2" ]; then
              echo "$2" | npx wrangler pages secret put "$1" --project-name wakfu-companion --env production
            else
              echo "Secret $1 non défini, ignoré."
            fi
          }
          push_secret DISCORD_CLIENT_ID "$DISCORD_CLIENT_ID"
          push_secret DISCORD_CLIENT_SECRET "$DISCORD_CLIENT_SECRET"
          push_secret GOOGLE_CLIENT_ID "$GOOGLE_CLIENT_ID"
          push_secret GOOGLE_CLIENT_SECRET "$GOOGLE_CLIENT_SECRET"
          push_secret PUBLIC_BASE_URL "$PUBLIC_BASE_URL"
          push_secret RATE_LIMIT_SALT "$RATE_LIMIT_SALT"
          push_secret APP_TOKEN_SECRET "$APP_TOKEN_SECRET"
          push_secret TURNSTILE_SITE_KEY "$TURNSTILE_SITE_KEY"
          push_secret TURNSTILE_SECRET_KEY "$TURNSTILE_SECRET_KEY"
        env:
          RATE_LIMIT_SALT: ${{ secrets.RATE_LIMIT_SALT }}
          # Jeton d'application + Turnstile (server/http/app-token.ts, turnstile.ts) : la clé de
          # site est publique (variable GitHub), le secret Turnstile et le secret HMAC non.
          APP_TOKEN_SECRET: ${{ secrets.APP_TOKEN_SECRET }}
          TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
          DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Production servie par Cloudflare Pages (déploiement natif et
      # atomique). L'ancien déploiement GitHub Pages (branche master, workflow
      # deploy-master.yml) a été décommissionné le 2026-09-19 : il ne servait
      # plus que de portail vers cette version, et le workflow système "pages
      # build and deployment" de GitHub restait de toute façon bloqué en
      # deployment_queued jusqu'au timeout depuis le passage au build
      # multi-fichiers (lot 1, commit 3ab11c78).
      # cloudflare/pages-action@v1 (déprécié depuis 2024) a disparu de GitHub
      # le 2026-09-18 (« Unable to resolve action `cloudflare/pages-action`,
      # not found » dès l'étape « Set up job ») : remplacé par
      # cloudflare/wrangler-action, qui réutilise le wrangler du package.json.
      # --branch explicite : main = branche de production du projet Pages,
      # toute autre = déploiement preview. gitHubToken conserve la création
      # des GitHub Deployments (permission deployments: write du job).
      - name: Deploy to Cloudflare Pages
        # --branch=main en dur (et non `github.ref_name`) : le job n'est de toute façon
        # autorisé que sur main (garde `if:` + environnement), ceinture et bretelles.
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0 (= tag v4 ; v4.1.x publiés sans dist/, inutilisables)
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: pages deploy dist/wakfu-companion/browser --project-name=wakfu-companion --branch=main --commit-dirty=true
