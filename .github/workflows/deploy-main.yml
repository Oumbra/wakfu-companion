name: Deploy main (Cloudflare Pages)

on:
  push:
    branches:
      - main
  # Déclenchement manuel via l'API (dispatch direct), indépendant de la
  # livraison webhook des push — utile pendant l'incident GitHub Actions du
  # 2026-08-06 (webhooks throttled), qui empêchait tout run de démarrer même
  # sur un push tout neuf. Voir docs/plan-migration-serveur.md.
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: preview-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Generate data tables
        run: npm run generate

      # Branche Neon de PRODUCTION (voir server/README.md) : DATABASE_URL,
      # secret distinct de DATABASE_URL_PREVIEW (utilisé par la preview, voir
      # deploy-preview.yml). Migrations jouées AVANT le build/déploiement du front.
      - name: Run DB migrations (production)
        run: npm run db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # Garde-fou : "drizzle-kit migrate" peut annoncer un succès sans avoir
      # réellement tout appliqué (vécu le 2026-08-12, voir le commentaire en
      # tête de server/db/verify-migrations.ts) — fait échouer le job plutôt
      # que de déployer silencieusement sur un schéma en retard.
      - name: Verify DB migrations (production)
        run: npm run db:verify-migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # Pas de --base-href custom : Cloudflare Pages sert ce projet à la
      # racine de son domaine, la balise <base href="/"> de src/index.html
      # convient donc telle quelle.
      - name: Build
        run: npx ng build

      # Rend DATABASE_URL disponible à l'exécution dans les Pages
      # Functions (functions/api/v1/*, context.env.DATABASE_URL) — distinct
      # des secrets GitHub Actions ci-dessus, qui ne servent qu'au moment du
      # build/CI. --env production cible l'environnement de production du
      # projet Cloudflare Pages.
      - name: Push DB secret to Cloudflare Pages (production)
        run: echo "$DATABASE_URL" | npx wrangler pages secret put DATABASE_URL --project-name wakfu-companion --env production
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Identifiants OAuth Discord/Google + origine publique (lot 5, prompt 5.1, voir
      # functions/api/_auth.ts). Chaque secret est poussé SEULEMENT s'il est défini : tant qu'une
      # application OAuth n'est pas créée côté fournisseur, les routes /auth/{provider}/* répondent
      # 503 « fournisseur non configuré » et le reste de l'application (mode invité) est intact —
      # jamais un déploiement en échec pour un secret manquant.
      - name: Push OAuth secrets to Cloudflare Pages (production)
        run: |
          push_secret() {
            if [ -n "$2" ]; then
              echo "$2" | npx wrangler pages secret put "$1" --project-name wakfu-companion --env production
            else
              echo "Secret $1 non défini, ignoré."
            fi
          }
          push_secret DISCORD_CLIENT_ID "$DISCORD_CLIENT_ID"
          push_secret DISCORD_CLIENT_SECRET "$DISCORD_CLIENT_SECRET"
          push_secret GOOGLE_CLIENT_ID "$GOOGLE_CLIENT_ID"
          push_secret GOOGLE_CLIENT_SECRET "$GOOGLE_CLIENT_SECRET"
          push_secret PUBLIC_BASE_URL "$PUBLIC_BASE_URL"
        env:
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
          DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Production servie par Cloudflare Pages (déploiement natif et
      # atomique). L'ancien déploiement GitHub Pages (branche master, workflow
      # deploy-master.yml) a été décommissionné le 2026-09-19 : il ne servait
      # plus que de portail vers cette version, et le workflow système "pages
      # build and deployment" de GitHub restait de toute façon bloqué en
      # deployment_queued jusqu'au timeout depuis le passage au build
      # multi-fichiers (lot 1, commit 3ab11c78).
      # cloudflare/pages-action@v1 (déprécié depuis 2024) a disparu de GitHub
      # le 2026-09-18 (« Unable to resolve action `cloudflare/pages-action`,
      # not found » dès l'étape « Set up job ») : remplacé par
      # cloudflare/wrangler-action, qui réutilise le wrangler du package.json.
      # --branch explicite : main = branche de production du projet Pages,
      # toute autre = déploiement preview. gitHubToken conserve la création
      # des GitHub Deployments (permission deployments: write ci-dessus).
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: pages deploy dist/wakfu-companion/browser --project-name=wakfu-companion --branch=${{ github.ref_name }} --commit-dirty=true
