name: Deploy preview (Cloudflare Pages)

on:
  push:
    branches:
      - claude/dev
  # Déclenchement manuel via l'API (dispatch direct), indépendant de la
  # livraison webhook des push — utile pendant l'incident GitHub Actions du
  # 2026-08-06 (webhooks throttled), qui empêchait tout run de démarrer même
  # sur un push tout neuf. Voir docs/plan-migration-serveur.md.
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: preview-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Generate data tables
        run: npm run generate

      # Branche Neon DÉDIÉE à la preview (jamais la production, voir
      # server/README.md) : DATABASE_URL_PREVIEW, secret distinct de
      # DATABASE_URL (utilisé par la prod, encore sur GitHub Pages — voir
      # plus bas). Migrations jouées AVANT le build/déploiement du front.
      - name: Run DB migrations (preview)
        run: npm run db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PREVIEW }}

      # Pas de --base-href custom : Cloudflare Pages sert ce projet à la
      # racine de son propre domaine (*.pages.dev), contrairement au hack de
      # sous-dossier /wakfu-companion/preview/claude-dev/ nécessaire sur
      # GitHub Pages (voir deploy-main.yml, qui reste sur GitHub Pages).
      - name: Build
        run: npx ng build

      # Rend DATABASE_URL_PREVIEW disponible à l'exécution dans les Pages
      # Functions (functions/api/v1/*, context.env.DATABASE_URL) — distinct
      # des secrets GitHub Actions ci-dessus, qui ne servent qu'au moment du
      # build/CI. --env preview cible spécifiquement l'environnement preview
      # du projet Cloudflare Pages (à vérifier au premier run : si le flag
      # n'est pas reconnu par cette version de wrangler, adapter ici).
      - name: Push DB secret to Cloudflare Pages (preview)
        run: echo "$DATABASE_URL_PREVIEW" | npx wrangler pages secret put DATABASE_URL --project-name wakfu-companion --env preview
        env:
          DATABASE_URL_PREVIEW: ${{ secrets.DATABASE_URL_PREVIEW }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Jeton de service statique protégeant les endpoints prix d'écriture/export (lot 4, prompt
      # 4.2, voir functions/api/_price-auth.ts) — même mécanisme que le secret DB ci-dessus, sans
      # rapport avec une session utilisateur. PRICE_SERVICE_TOKEN_PREVIEW distinct de
      # PRICE_SERVICE_TOKEN (prod, pas encore utilisé — prod reste sur GitHub Pages sans Functions
      # pour l'instant), même convention que DATABASE_URL/DATABASE_URL_PREVIEW.
      - name: Push price service token to Cloudflare Pages (preview)
        run: echo "$PRICE_SERVICE_TOKEN_PREVIEW" | npx wrangler pages secret put PRICE_SERVICE_TOKEN --project-name wakfu-companion --env preview
        env:
          PRICE_SERVICE_TOKEN_PREVIEW: ${{ secrets.PRICE_SERVICE_TOKEN_PREVIEW }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Identifiants OAuth Discord/Google + origine publique (lot 5, prompt 5.1, voir
      # functions/api/_auth.ts). Chaque secret est poussé SEULEMENT s'il est défini : tant qu'une
      # application OAuth n'est pas créée côté fournisseur, les routes /auth/{provider}/* répondent
      # 503 « fournisseur non configuré » et le reste de l'application (mode invité) est intact —
      # jamais un déploiement en échec pour un secret manquant.
      - name: Push OAuth secrets to Cloudflare Pages (preview)
        run: |
          push_secret() {
            if [ -n "$2" ]; then
              echo "$2" | npx wrangler pages secret put "$1" --project-name wakfu-companion --env preview
            else
              echo "Secret $1 non défini, ignoré."
            fi
          }
          push_secret DISCORD_CLIENT_ID "$DISCORD_CLIENT_ID"
          push_secret DISCORD_CLIENT_SECRET "$DISCORD_CLIENT_SECRET"
          push_secret GOOGLE_CLIENT_ID "$GOOGLE_CLIENT_ID"
          push_secret GOOGLE_CLIENT_SECRET "$GOOGLE_CLIENT_SECRET"
          push_secret PUBLIC_BASE_URL "$PUBLIC_BASE_URL_PREVIEW"
        env:
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID_PREVIEW }}
          DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET_PREVIEW }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID_PREVIEW }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET_PREVIEW }}
          PUBLIC_BASE_URL_PREVIEW: ${{ vars.PUBLIC_BASE_URL_PREVIEW }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # La preview (claude/dev) est passée sur Cloudflare Pages (déploiement
      # natif, sans hack de sous-dossier ni dépendance au workflow système
      # GitHub instable — voir l'historique de deploy-main.yml) : le workflow
      # système "pages build and deployment" de GitHub restait bloqué en
      # deployment_queued jusqu'au timeout dès le passage au build
      # multi-fichiers (lot 1, commit 3ab11c78), y compris via le pipeline
      # Actions natif (upload-pages-artifact + deploy-pages, cf. tentatives
      # du 2026-08-06). La prod (master) reste sur GitHub Pages pendant la
      # migration (voir docs/plan-migration-serveur.md) — seule la preview
      # est avancée sur la cible finale, functions/api/ compris.
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: wakfu-companion
          directory: dist/wakfu-companion/browser
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
