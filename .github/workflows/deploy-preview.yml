name: Deploy preview (Cloudflare Pages)

on:
  push:
    branches:
      - claude/dev
  # Déclenchement manuel via l'API (dispatch direct), indépendant de la
  # livraison webhook des push — utile pendant l'incident GitHub Actions du
  # 2026-08-06 (webhooks throttled), qui empêchait tout run de démarrer même
  # sur un push tout neuf.
  workflow_dispatch:

# Permissions minimales au niveau du workflow ; `deployments: write` n'est
# accordé qu'au job de déploiement (GitHub Deployments via wrangler-action).
permissions:
  contents: read

# Groupe propre à la preview (voir le commentaire de `deploy-main.yml` : ne
# jamais partager ce groupe avec la production).
concurrency:
  group: preview-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    # Garde de ref : un `workflow_dispatch` lancé depuis une autre branche ne
    # déploie rien. La vraie barrière reste la règle de branche de
    # l'environnement GitHub `preview` (Settings → Environments).
    if: github.ref == 'refs/heads/claude/dev'
    runs-on: ubuntu-latest
    # Secrets *_PREVIEW portés par l'environnement `preview` (à y déplacer
    # depuis les secrets de dépôt, procédure dans server/README.md).
    environment:
      name: preview
      url: https://claude-dev.wakfu-companion.com
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Aucun push git dans ce job : ne pas laisser le GITHUB_TOKEN dans .git/config.
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          # setup-node >= v5 active seul le cache npm (champ packageManager) : job porteur de
          # secrets, pas de cache restauré (risque d'empoisonnement de cache).
          package-manager-cache: false

      # `--ignore-scripts` + `npm rebuild` ciblé : même raisonnement que
      # deploy-main.yml (job porteur de secrets).
      - name: Install dependencies
        run: |
          npm ci --ignore-scripts
          npm rebuild esbuild workerd

      - name: Generate data tables
        run: npm run generate

      # Branche Neon DÉDIÉE à la preview (jamais la production, voir
      # server/README.md) : DATABASE_URL_PREVIEW, secret distinct de
      # DATABASE_URL (utilisé par la prod, voir deploy-main.yml). Migrations
      # jouées AVANT le build/déploiement du front.
      - name: Run DB migrations (preview)
        run: npm run db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PREVIEW }}

      # Garde-fou : "drizzle-kit migrate" peut annoncer un succès sans avoir
      # réellement tout appliqué (vécu le 2026-08-12, voir le commentaire en
      # tête de server/db/verify-migrations.ts) — fait échouer le job plutôt
      # que de déployer silencieusement sur un schéma en retard.
      - name: Verify DB migrations (preview)
        run: npm run db:verify-migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PREVIEW }}

      # Pas de --base-href custom : Cloudflare Pages sert ce projet à la
      # racine de son domaine, la balise <base href="/"> de src/index.html
      # convient donc telle quelle.
      - name: Build
        run: npx ng build

      # Icônes wakassets publiées en fichiers statiques sous /api/v1/icons (+ _routes.json qui sort
      # ce chemin des Functions) : plus aucune invocation de Function par icône affichée — le
      # quota quotidien a été dépassé le 2026-09-23 (projet en « Fail open » : toute l'API servait
      # index.html). Détails : tools/bundle-wakassets-icons.mjs.
      - name: Bundle wakassets icons
        run: node tools/bundle-wakassets-icons.mjs dist/wakfu-companion/browser

      # Rend DATABASE_URL_PREVIEW disponible à l'exécution dans les Pages
      # Functions (functions/api/v1/*, context.env.DATABASE_URL) — distinct
      # des secrets GitHub Actions ci-dessus, qui ne servent qu'au moment du
      # build/CI. --env preview cible spécifiquement l'environnement preview
      # du projet Cloudflare Pages (à vérifier au premier run : si le flag
      # n'est pas reconnu par cette version de wrangler, adapter ici).
      # Rôle `app_runtime` de la branche Neon de preview, comme en production (deploy-main.yml).
      - name: Push DB secret to Cloudflare Pages (preview)
        run: |
          if [ -z "$DATABASE_URL_APP_PREVIEW" ]; then
            echo "::error::Secret DATABASE_URL_APP_PREVIEW absent de l'environnement preview (rôle app_runtime, voir server/README.md)."
            exit 1
          fi
          echo "$DATABASE_URL_APP_PREVIEW" | npx wrangler pages secret put DATABASE_URL --project-name wakfu-companion --env preview
        env:
          DATABASE_URL_APP_PREVIEW: ${{ secrets.DATABASE_URL_APP_PREVIEW }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Identifiants OAuth Discord/Google + origine publique (lot 5, prompt 5.1, voir
      # functions/api/_auth.ts). Chaque secret est poussé SEULEMENT s'il est défini : tant qu'une
      # application OAuth n'est pas créée côté fournisseur, les routes /auth/{provider}/* répondent
      # 503 « fournisseur non configuré » et le reste de l'application (mode invité) est intact —
      # jamais un déploiement en échec pour un secret manquant.
      - name: Push OAuth secrets to Cloudflare Pages (preview)
        run: |
          push_secret() {
            if [ -n "$2" ]; then
              echo "$2" | npx wrangler pages secret put "$1" --project-name wakfu-companion --env preview
            else
              echo "Secret $1 non défini, ignoré."
            fi
          }
          push_secret DISCORD_CLIENT_ID "$DISCORD_CLIENT_ID"
          push_secret DISCORD_CLIENT_SECRET "$DISCORD_CLIENT_SECRET"
          push_secret GOOGLE_CLIENT_ID "$GOOGLE_CLIENT_ID"
          push_secret GOOGLE_CLIENT_SECRET "$GOOGLE_CLIENT_SECRET"
          push_secret PUBLIC_BASE_URL "$PUBLIC_BASE_URL_PREVIEW"
          push_secret RATE_LIMIT_SALT "$RATE_LIMIT_SALT"
          push_secret APP_TOKEN_SECRET "$APP_TOKEN_SECRET"
          push_secret TURNSTILE_SITE_KEY "$TURNSTILE_SITE_KEY"
          push_secret TURNSTILE_SECRET_KEY "$TURNSTILE_SECRET_KEY"
        env:
          RATE_LIMIT_SALT: ${{ secrets.RATE_LIMIT_SALT_PREVIEW }}
          # Jeton d'application + Turnstile (voir deploy-main.yml) — variantes _PREVIEW, un widget
          # Turnstile distinct dont le domaine est celui de la preview.
          APP_TOKEN_SECRET: ${{ secrets.APP_TOKEN_SECRET_PREVIEW }}
          TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY_PREVIEW }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY_PREVIEW }}
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID_PREVIEW }}
          DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET_PREVIEW }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID_PREVIEW }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET_PREVIEW }}
          PUBLIC_BASE_URL_PREVIEW: ${{ vars.PUBLIC_BASE_URL_PREVIEW }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Preview (claude/dev) servie par Cloudflare Pages, comme la production
      # (voir deploy-main.yml) : déploiement natif et atomique. L'ancien
      # déploiement GitHub Pages a été décommissionné le 2026-09-19.
      # cloudflare/pages-action@v1 (déprécié depuis 2024) a disparu de GitHub
      # le 2026-09-18 (« Unable to resolve action `cloudflare/pages-action`,
      # not found » dès l'étape « Set up job ») : remplacé par
      # cloudflare/wrangler-action, qui réutilise le wrangler du package.json.
      # --branch explicite : main = branche de production du projet Pages,
      # toute autre = déploiement preview. gitHubToken conserve la création
      # des GitHub Deployments (permission deployments: write du job).
      - name: Deploy to Cloudflare Pages
        # --branch=claude/dev en dur (le job n'est autorisé que sur cette branche).
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0 (= tag v4 ; v4.1.x publiés sans dist/, inutilisables)
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: pages deploy dist/wakfu-companion/browser --project-name=wakfu-companion --branch=claude/dev --commit-dirty=true
