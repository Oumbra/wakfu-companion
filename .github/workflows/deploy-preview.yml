name: Deploy preview (GitHub Pages)

on:
  push:
    branches:
      - claude/dev

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Generate data tables
        run: npm run generate

      # --base-href explicite : la preview vit sous /wakfu-companion/preview/claude-dev/,
      # pas à la racine du domaine (voir le commentaire équivalent dans deploy-main.yml).
      - name: Build
        run: npx ng build --base-href /wakfu-companion/preview/claude-dev/

      - name: Prepare deploy directory
        run: |
          mkdir -p public_deploy
          cp -r dist/wakfu-companion/browser/. public_deploy/

      # keep_files: true — voir le commentaire détaillé dans deploy-main.yml
      # (même compromis : nécessaire pour ne pas effacer l'autre déploiement
      # sur cette même branche gh-pages, au prix d'une légère accumulation de
      # fichiers hashés obsolètes, pont temporaire avant Cloudflare Pages).
      #
      # gh-pages sert ici uniquement de zone de fusion entre prod (racine) et
      # preview (preview/claude-dev/) — voir les étapes suivantes pour la
      # publication réelle.
      - name: Merge into gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public_deploy
          destination_dir: preview/claude-dev
          keep_files: true

      # Publication via le pipeline GitHub Actions natif — voir le commentaire
      # détaillé dans deploy-main.yml (workflow système "pages build and
      # deployment" instable depuis le lot 1, bloqué en deployment_queued).
      - name: Checkout gh-pages (fusionné)
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages-site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: gh-pages-site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
