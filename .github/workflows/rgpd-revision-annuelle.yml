# Rappel annuel de l'entretien RGPD (docs/analyse-rgpd.md, point « entretien récurrent »).
#
# Chaque 1er septembre, ouvre une issue assignée au responsable de traitement avec la liste de
# contrôle à dérouler avant le 19 septembre (date anniversaire des documents rédigés le
# 19 septembre 2026 : registre, note de mise en balance, note d'absence d'AIPD, procédure de
# violation, `sous-traitants-dpa.md` §5). Les documents eux-mêmes vivent hors dépôt (dossier
# local `wakfu-companion-rgpd` du responsable de traitement) : l'issue ne contient que la liste,
# jamais leur contenu.
#
# Limites connues, d'où le doublon calendrier (`revision-rgpd.ics`, hors dépôt) :
# - un `schedule` ne tourne que depuis la branche par défaut (`main`) — inactif tant que
#   `claude/dev` n'y est pas fusionnée ;
# - GitHub désactive les workflows planifiés d'un dépôt public sans commit depuis 60 jours
#   (courriel d'avertissement, réactivation en un clic dans l'onglet Actions).
# `workflow_dispatch` permet de le déclencher à la main (test, ou rattrapage après désactivation).
name: RGPD — révision annuelle

on:
  schedule:
    # 1er septembre, 08:00 UTC — trois semaines avant l'échéance du 19 septembre.
    - cron: '0 8 1 9 *'
  workflow_dispatch:

permissions:
  issues: write

jobs:
  open-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Ouvrir l'issue de révision (si absente)
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const year = new Date().getUTCFullYear();
            const title = `RGPD — révision annuelle ${year}`;
            const assignee = context.repo.owner;

            // Idempotent : un second déclenchement (manuel, ou après réactivation) ne duplique
            // pas l'issue tant que celle de l'année est encore ouverte.
            const { data: open } = await github.rest.issues.listForRepo({
              ...context.repo,
              state: 'open',
              per_page: 100,
            });
            if (open.some((issue) => issue.title === title && !issue.pull_request)) {
              core.info(`« ${title} » existe déjà, rien à faire.`);
              return;
            }

            // Décision d'adéquation du Royaume-Uni (base Neon à Londres) : renouvelée le
            // 21 décembre 2025, valable jusqu'en 2031 — à partir de 2030, la révision doit
            // préparer la suite (migration UE ou clauses contractuelles types avec Databricks).
            const adequacy =
              year >= 2030
                ? `> ⚠️ **Adéquation Royaume-Uni : échéance 2031.** Vérifier si la Commission a engagé le\n` +
                  `> renouvellement ; sinon, planifier dès maintenant la migration de la base vers une région UE\n` +
                  `> ou la signature des clauses contractuelles types avec Databricks (registre §7).\n\n`
                : '';

            const body =
              `Échéance : **19 septembre ${year}** (documents du 19 septembre 2026, relecture annuelle).\n` +
              `Dossier : \`wakfu-companion-rgpd\` (hors dépôt) — voir \`docs/analyse-rgpd.md\` pour le contexte.\n\n` +
              adequacy +
              `### Sous-traitants (\`sous-traitants-dpa.md\` §5)\n` +
              `- [ ] Re-télécharger les trois DPA (Cloudflare, Databricks/Neon, GitHub), comparer version/date avec les copies archivées dans \`dpa/\`, archiver une nouvelle copie datée si changement (garder l'ancienne).\n` +
              `- [ ] Vérifier que Cloudflare, Google et Discord figurent toujours sur la liste du Data Privacy Framework (https://www.dataprivacyframework.gov/list).\n` +
              `- [ ] Relire les listes de sous-traitants ultérieurs de Cloudflare et Databricks (changement de région ou de prestataire pouvant toucher la localisation de Neon).\n` +
              `- [ ] Vérifier que la décision d'adéquation du Royaume-Uni est toujours en vigueur (https://commission.europa.eu/law/law-topic/data-protection/international-dimension-data-protection/adequacy-decisions_en).\n` +
              `- [ ] Vérifier que la politique de confidentialité §3 et §4 cite toujours exactement ces prestataires, avec leurs adresses.\n\n` +
              `### Documents du responsable de traitement\n` +
              `- [ ] Registre des traitements : relire, confirmer qu'aucune table/clé/tiers n'est apparu sans y figurer (\`server/db/schema.ts\`, \`server/settings/keys.ts\`, règle \`.claude/rules/user-data-legal.md\`).\n` +
              `- [ ] Note de mise en balance (pseudonymes de tiers) : conditions de révision toujours remplies ?\n` +
              `- [ ] Note art. 14 (information des joueurs tiers, exception d'effort disproportionné) : le service a-t-il gagné un moyen de les joindre, un contenu public ou une interaction entre joueurs, qui ferait tomber l'exception ?\n` +
              `- [ ] Note d'absence d'AIPD : aucun nouveau critère CNIL/G29 atteint ?\n` +
              `- [ ] Procédure de violation de données : contacts, hébergeur, base et mécanisme d'authentification inchangés ?\n` +
              `- [ ] Politique de confidentialité, CGU, mentions légales : date « Dernière mise à jour » et contenu cohérents avec le code (4 locales).\n\n` +
              `### Conformité CGU Ankama (\`docs/analyse-cgu-2026-09-21.md\`)\n` +
              `- [ ] Re-télécharger les CGU Ankama, les Règles de conduite WAKFU et la licence de données WAKFU ; comparer avec les extraits du § 6 de l'analyse (numéros d'articles et formulations).\n` +
              `- [ ] Rejouer l'audit article par article sur le code de l'année (marques et textes cachés, images et référentiel, API et relais d'icônes, overlay) et journaliser le résultat au § 7.\n` +
              `- [ ] Demande d'autorisation à Ankama : envoyée ? réponse reçue et archivée dans \`docs/\` ? plan B déclenché en cas de refus ?\n` +
              `- [ ] Mention imposée par la licence de données (\`footer.copyright\`, 4 locales) : libellé et année toujours exacts.\n\n` +
              `### Clôture\n` +
              `- [ ] Mettre à jour la ligne **Version** du registre et la date de relecture de chaque document touché.\n` +
              `- [ ] Fermer cette issue.\n`;

            const { data: issue } = await github.rest.issues.create({
              ...context.repo,
              title,
              body,
              assignees: [assignee],
              labels: ['documentation'],
            });
            core.info(`Issue #${issue.number} ouverte : ${issue.html_url}`);
