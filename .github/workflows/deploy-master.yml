name: Deploy production (GitHub Pages)

on:
  push:
    branches:
      - master

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Generate data tables
        run: npm run generate

      # --base-href explicite : ce dépôt n'est pas un user.github.io, le site
      # est donc servi sous /wakfu-companion/ (pas à la racine du domaine).
      # Le build standalone n'avait jamais eu besoin de <base href> (tout
      # inliné dans un seul fichier, aucune requête d'asset relative) — ce
      # réglage est nouveau avec un build classique multi-fichiers.
      - name: Build
        run: npx ng build --base-href /wakfu-companion/

      - name: Prepare deploy directory
        run: |
          mkdir -p public_deploy
          cp -r dist/wakfu-companion/browser/. public_deploy/

      # keep_files: true est nécessaire car ce dépôt publie deux déploiements
      # (production ici, preview dans deploy-preview.yml) sur la MÊME branche
      # gh-pages, à des destination_dir différents — désactiver keep_files
      # effacerait tout le contenu de la branche, y compris l'autre
      # déploiement. Contrepartie acceptée : avec outputHashing "all", les
      # fichiers JS/CSS hashés des anciens déploiements s'accumulent sans
      # jamais être nettoyés (seul index.html est réellement remplacé à
      # chaque déploiement). Sans impact fonctionnel, juste un peu de
      # contenu mort sur gh-pages — pont temporaire avant la migration vers
      # Cloudflare Pages (voir docs/plan-migration-serveur.md), qui fait des
      # déploiements atomiques sans ce problème.
      #
      # gh-pages sert ici uniquement de zone de fusion entre prod (racine) et
      # preview (preview/claude-dev/) — voir les étapes suivantes pour la
      # publication réelle.
      - name: Merge into gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public_deploy
          destination_dir: .
          keep_files: true

      # Publication via le pipeline GitHub Actions natif (upload-pages-artifact
      # + deploy-pages) plutôt que de laisser le workflow système "pages build
      # and deployment" (déclenché automatiquement par GitHub sur push
      # gh-pages) s'en charger. Ce workflow système s'est révélé instable dès
      # le passage au build multi-fichiers (lot 1, commit 3ab11c78) : la
      # publication reste bloquée en "deployment_queued" jusqu'au timeout de
      # 10 min sans jamais aboutir, y compris en repoussant un commit tout
      # neuf sur gh-pages. En pilotant nous-mêmes le déploiement, on obtient
      # la méthode officielle recommandée par GitHub (au lieu de dépendre du
      # mécanisme "Deploy from a branch" historique) sans changer la
      # coexistence prod/preview sur un seul site (contrainte de la
      # plateforme, indépendante du mécanisme de déploiement).
      - name: Checkout gh-pages (fusionné)
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages-site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: gh-pages-site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
