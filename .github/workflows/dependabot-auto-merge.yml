name: Dependabot auto-merge

# Active l'auto-merge GitHub sur les PR Dependabot de correctif/mineure visant `claude/dev` :
# GitHub fusionne seul quand le check requis `test` (ci.yml) est vert — il faut pour cela le
# ruleset `claude/dev` (check `test` obligatoire) et « Allow auto-merge » dans les réglages du
# dépôt ; sans check requis, l'auto-merge fusionnerait immédiatement.
# - Majeures : jamais automatiques, relecture manuelle (les majeures Angular/TypeScript sont en
#   outre ignorées dans dependabot.yml).
# - Paquets qui ne s'exécutent qu'aux déploiements, aux migrations ou dans les jobs porteurs des
#   secrets de production (DATABASE_URL, jeton Cloudflare), jamais dans la CI d'une PR : jamais
#   automatiques, même en correctif (audit du 2026-09-23, S4/S5). Une version compromise ou
#   cassée n'y serait détectée qu'une fois en production. Liste : MANUAL_REVIEW ci-dessous.
# - Squash : un commit par PR sur `claude/dev`, titré par le titre Conventional Commits de la PR
#   (`chore`/`ci` : aucun bump de version).

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.event.pull_request.base.ref == 'claude/dev'
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      - name: Enable auto-merge
        if: steps.meta.outputs.update-type != 'version-update:semver-major'
        # Comparaison exacte nom par nom (un `contains` sur la liste brute confondrait
        # `drizzle-orm` et `drizzle-orm-extra`). Un seul paquet listé suffit à tout bloquer : une
        # PR groupée qui en contient un est relue à la main.
        run: |
          IFS=',' read -ra names <<< "$DEPENDENCY_NAMES"
          for name in "${names[@]}"; do
            name="$(echo "$name" | xargs)"
            for manual in $MANUAL_REVIEW; do
              if [ "$name" = "$manual" ]; then
                echo "::notice::$name exige une relecture manuelle : pas d'auto-merge."
                exit 0
              fi
            done
          done
          gh pr merge --auto --squash "$PR_URL"
        env:
          DEPENDENCY_NAMES: ${{ steps.meta.outputs.dependency-names }}
          MANUAL_REVIEW: >-
            cloudflare/wrangler-action
            actions/github-script
            dependabot/fetch-metadata
            wrangler
            drizzle-kit
            drizzle-orm
            @neondatabase/serverless
            tsx
            @angular/build
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
